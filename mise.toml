[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
prek = "0.5.9"
goreleaser = "2.19.0"
actionlint = "1.7.12"

[tasks.fmt]
description = "Format Go code (gofmt + goimports)"
run = "golangci-lint fmt"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.check]
description = "fmt, lint and test, in order"
run = ["mise run fmt", "mise run lint", "mise run test"]

[tasks.build]
description = "Build ./gogloader"
run = "go build -o gogloader ./cmd/gogloader"

[tasks."hooks:install"]
description = "Install the prek git hooks"
run = "prek install"

[tasks."hooks:run"]
description = "Run every prek hook against all files"
run = "prek run --all-files"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build all release artifacts locally into dist/ (no publishing)"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Publish a release (CI only; needs GITHUB_TOKEN and HOMEBREW_TAP_TOKEN)"
run = "goreleaser release --clean"
