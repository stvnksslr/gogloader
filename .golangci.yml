version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      # Unchecked Close/Remove/RemoveAll/fmt.Fprint* and similar, which are
      # deliberate best-effort calls here.
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stvnksslr/gogloader
